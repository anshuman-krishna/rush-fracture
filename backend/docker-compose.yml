services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_ADDRESS: ":8080"
      DATABASE_PATH: "/data/rush-fracture.db"
      # generate a real secret before going live: openssl rand -hex 32
      API_KEY: "${API_KEY:?set API_KEY in a .env file or the environment}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      RATE_LIMIT_PER_MIN: "${RATE_LIMIT_PER_MIN:-120}"
      MAX_BODY_BYTES: "${MAX_BODY_BYTES:-65536}"
    volumes:
      - db-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db-data:
